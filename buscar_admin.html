        <div class="row mt-2">
          <div class="col-sm-6" id="resultado_forro" style="display: none;">
              <div class="card shadow" style="height: 500px;">
                  <div class="card-body">

        <script src="js/jquery-3.3.1.min.js"></script>
        <script src="js/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <script src="js/script.js"></script>
        <script src="https://www.gstatic.com/charts/loader.js"></script>
        <script>
            $( document ).ready(function() {
                // Obtener la fecha actual
                var fechaActual = new Date();

                // Obtener el primer día del mes actual
                var primerDiaDelMes = new Date(fechaActual.getFullYear(), fechaActual.getMonth(), 1);

                // Obtener el último día del mes actual
                var ultimoDiaDelMes = new Date(fechaActual.getFullYear(), fechaActual.getMonth() + 1, 0);

                // Función para formatear la fecha como "yyyy-mm-dd"
                function formatDate(date) {
                    var year = date.getFullYear();
                    var month = ('0' + (date.getMonth() + 1)).slice(-2); // Agrega un cero adelante si es necesario
                    var day = ('0' + date.getDate()).slice(-2); // Agrega un cero adelante si es necesario
                    return year + '-' + month + '-' + day;
                }

                // Formatear las fechas y mostrar en la consola
                var primerDiaFormateado = formatDate(primerDiaDelMes);
                var ultimoDiaFormateado = formatDate(ultimoDiaDelMes);
                $("#fecha_ini").val(primerDiaFormateado);
                $("#fecha_fin").val(ultimoDiaFormateado);
                //console.log("Primer día del mes: ", primerDiaFormateado);
                //console.log("Último día del mes: ", ultimoDiaFormateado);
            });
            function buscar_fecha() {
              var parametros = {
                "accion"   : "1",
                "fecha_ini": $("#fecha_ini").val(),
                "fecha_fin": $("#fecha_fin").val()
                };
                $.ajax({            
                    data:  parametros,
                    url: 'php/buscar_admin.php',
                    type: 'post',  
                    success: function (response) {
                      $("#resultado").html(response);
                    }
                });

                var parametros = {
                "accion"   : "2",
                "fecha_ini": $("#fecha_ini").val(),
                "fecha_fin": $("#fecha_fin").val()
                };
                $.ajax({            
                    data:  parametros,
                    url: 'php/buscar_admin.php',
                    type: 'post',  
                    dataType: 'json',

                    success: function (response) {
                        google.charts.load("current", {packages:["corechart"]});
                        google.charts.setOnLoadCallback(drawChart);
                        function drawChart() {
                            
                            var data = [['Element', 'Cantidad', { role: 'style' } ]];

                            for (var key in response) {
                                var element = response[key][0];
                                var density = parseFloat(response[key][1]);
                                var style = response[key][2];

                                data.push([element, density, style]);
                            }

                            data.sort(function(a, b) {
                              return b[1] - a[1];
                            });
                            //console.log(data);
                            var dataTable = google.visualization.arrayToDataTable(data);
                            var view = new google.visualization.DataView(dataTable);
                            view.setColumns([0, 1,
                                            { calc: "stringify",
                                                sourceColumn: 1,
                                                type: "string",
                                                role: "annotation" },
                                            2]);

                            var options = {
                                title: "Cantidad de forros vendidos entre el "+parametros.fecha_ini + " y " +parametros.fecha_fin,
                                chartArea: {left: 250, top: 30, right: 20, bottom: 50},
                                //width: 600,
                                //height: 600,
                                bar: {groupWidth: "90%"},
                                legend: { position: "none" },
                            };
                            
                            var chart = new google.visualization.BarChart(document.getElementById("chart_div"));
                            chart.draw(view, options);
                        }
                        window.addEventListener('resize', function(){
                          drawChart(); // Llama a la función de dibujo del gráfico cuando la ventana se redimensiona
                        });
                    }
                });
                $('#resultado_forro').show();


                var parametros = {
                "accion"   : "3",
                "fecha_ini": $("#fecha_ini").val(),
                "fecha_fin": $("#fecha_fin").val()
                };
                $.ajax({            
                    data:  parametros,
                    url: 'php/buscar_admin.php',
                    type: 'post',  
                    dataType: 'json',
                    success: function (response) {
                      
                      //$("#resultado_ciudad").html(response);
                      //console.log(response);
                      google.charts.load('current', {'packages':['corechart']});
                      google.charts.setOnLoadCallback(drawChart);

                      function drawChart() {
                        var formattedData = [['City', 'Value']]; // Crear una matriz para los datos en el formato adecuado

                        for (var key in response) {
                          formattedData.push([response[key][0], parseInt(response[key][1])]);
                        }

                        //console.log(formattedData);

                        var data = google.visualization.arrayToDataTable(formattedData);
                        
                        var options = {
                          title: "Cantidad de ventas por ciudad entre el "+parametros.fecha_ini + " y " +parametros.fecha_fin,
                          
                          chartArea: {left: 10, top: 25, right: 10, bottom: 10},
                        };

                        var chart = new google.visualization.PieChart(document.getElementById('piechart'));

                        chart.draw(data, options);
                        
                      }
                      window.addEventListener('resize', function(){
                          drawChart(); // Llama a la función de dibujo del gráfico cuando la ventana se redimensiona
                        });
                    }
                });

            }

            
        </script>
